name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: install
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: test
        run: npm test

      - name: build
        run: npm run build

      # The flush timer must not keep a Node process alive. Fails by hanging.
      - name: node exits after init
        timeout-minutes: 1
        run: >
          node --input-type=module -e "import('./dist/index.js').then((sdk) =>
          sdk.init({ dsn: 'https://a1b2c3@ingest.invalid/42' }))"
