name: release-tarball

# Apps install the SDK from this tarball: a github: dependency records git+ssh
# in the lockfile, and npm ci then fails in Docker and CI without a key.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tarball:
    runs-on: [self-hosted, sbk-small]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      - name: pack
        run: npm pack

      - name: upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # The self-hosted runner has no gh CLI; the REST API needs only curl.
        # release-notes.mjs puts the tarball's checksums in the release body and keeps the rest of it.
        run: |
          tarball="argos-browser-${VERSION}.tgz"
          test -f "$tarball"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          release=$(curl -fsS "${auth[@]}" "$api/releases/tags/$TAG" 2>/dev/null || true)
          payload=$(printf '%s' "$release" | node scripts/release-notes.mjs "$tarball" "$GITHUB_REPOSITORY" "$TAG")
          id=$(printf '%s' "$release" | node -p 'JSON.parse(require("fs").readFileSync(0)).id' 2>/dev/null || true)
          if [ -z "$id" ] || [ "$id" = undefined ]; then method=POST url="$api/releases"; else method=PATCH url="$api/releases/$id"; fi
          id=$(curl -fsS "${auth[@]}" -X "$method" "$url" -d "$payload" | node -p 'JSON.parse(require("fs").readFileSync(0)).id')
          old=$(curl -fsS "${auth[@]}" "$api/releases/$id/assets" | node -p 'const a=JSON.parse(require("fs").readFileSync(0)).find(x=>x.name===process.argv[1]); a?a.id:""' "$tarball")
          # Lockfiles pin the tarball's sha512: replacing it breaks npm ci for every app. Content changes need a new version.
          if [ -n "$old" ]; then echo "::error::$tarball is already on $TAG; bump the version instead of re-publishing it"; exit 1; fi
          curl -fsS "${auth[@]}" -H "Content-Type: application/gzip" --data-binary "@$tarball" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/$id/assets?name=$tarball" >/dev/null
